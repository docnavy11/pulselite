<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Lite Test Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; }
    .layout { display: grid; grid-template-columns: 260px 1fr 380px; height: 100vh; }
    .sidebar { background: #161b22; border-right: 1px solid #30363d; padding: 16px; overflow-y: auto; }
    .main { overflow-y: auto; padding: 16px; }
    .widget-panel { background: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #58a6ff; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; margin: 16px 0 8px; }
    h3 { font-size: 14px; font-weight: 600; color: #c9d1d9; margin-bottom: 8px; }

    /* Sidebar */
    .endpoints { list-style: none; }
    .endpoints li { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 2px; color: #8b949e; }
    .endpoints li code { color: #79c0ff; font-size: 11px; }
    .filter-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .filter-btn { font-size: 11px; padding: 4px 10px; border: 1px solid #30363d; background: transparent; color: #8b949e; border-radius: 12px; cursor: pointer; }
    .filter-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .filter-btn:hover { border-color: #58a6ff; }

    /* Mock config */
    .config-group { margin-bottom: 12px; padding: 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
    .config-group label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 4px; }
    .config-group select, .config-group input { font-size: 12px; padding: 4px 8px; background: #161b22; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; width: 100%; }

    /* Log entries */
    .log-entry { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .log-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
    .log-header:hover { background: #1c2128; }
    .log-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
    .log-badge.webhook { background: #1f3a5f; color: #58a6ff; }
    .log-badge.slack { background: #1a3a2a; color: #3fb950; }
    .log-badge.stripe { background: #3d2b5a; color: #bc8cff; }
    .log-badge.salesforce { background: #2b3a5a; color: #79c0ff; }
    .log-badge.linear { background: #3a2b3a; color: #f778ba; }
    .log-badge.hubspot { background: #3a2b1a; color: #f0883e; }
    .log-badge.calendly { background: #1a3a3a; color: #56d4dd; }
    .log-badge.calcom { background: #1a3a3a; color: #56d4dd; }
    .log-badge.unknown { background: #2a2a2a; color: #8b949e; }
    .log-method { font-size: 11px; font-weight: 700; color: #79c0ff; font-family: monospace; }
    .log-path { font-size: 12px; color: #c9d1d9; font-family: monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-time { font-size: 11px; color: #484f58; white-space: nowrap; }
    .log-status { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 8px; }
    .log-status.s2xx { background: #1a3a2a; color: #3fb950; }
    .log-status.s4xx { background: #3a2a1a; color: #f0883e; }
    .log-status.s5xx { background: #3a1a1a; color: #f85149; }
    .log-body { padding: 0 12px 12px; display: none; }
    .log-body.open { display: block; }
    .log-body pre { font-size: 11px; line-height: 1.5; background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px; overflow-x: auto; color: #c9d1d9; white-space: pre-wrap; word-break: break-all; }
    .log-body h4 { font-size: 11px; color: #8b949e; margin: 8px 0 4px; text-transform: uppercase; }

    /* Widget panel */
    .widget-header { padding: 12px 16px; border-bottom: 1px solid #30363d; }
    .widget-config { padding: 12px 16px; border-bottom: 1px solid #30363d; }
    .widget-config label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 4px; }
    .widget-config input { font-size: 12px; padding: 6px 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; width: 100%; margin-bottom: 8px; }
    .widget-config button { font-size: 12px; padding: 6px 14px; background: #238636; border: none; color: #fff; border-radius: 6px; cursor: pointer; width: 100%; }
    .widget-config button:hover { background: #2ea043; }
    .widget-frame { flex: 1; background: #fff; position: relative; }
    .widget-frame iframe { width: 100%; height: 100%; border: none; }
    .widget-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 13px; text-align: center; padding: 20px; }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .toolbar .count { font-size: 12px; color: #8b949e; }
    .clear-btn { font-size: 11px; padding: 4px 12px; background: #da3633; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
    .clear-btn:hover { background: #f85149; }
    .empty-state { text-align: center; padding: 60px 20px; color: #484f58; }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    /* Live indicator */
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #3fb950; }
    .live-dot { width: 6px; height: 6px; background: #3fb950; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Connection params */
    .conn-card { margin-bottom: 8px; padding: 8px 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
    .conn-card .conn-label { font-size: 11px; font-weight: 600; color: #c9d1d9; margin-bottom: 4px; }
    .conn-card .conn-desc { font-size: 10px; color: #484f58; margin-bottom: 6px; line-height: 1.4; }
    .conn-card .conn-field { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .conn-card .conn-field label { font-size: 10px; color: #8b949e; width: 52px; flex-shrink: 0; }
    .conn-card .conn-url { flex: 1; font-size: 10px; font-family: monospace; color: #79c0ff; background: #161b22; border: 1px solid #21262d; border-radius: 3px; padding: 3px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .conn-card .conn-url:hover { background: #1c2128; border-color: #58a6ff; }
    .conn-card .conn-url.copied { color: #3fb950; border-color: #238636; }
    .conn-card .conn-where { font-size: 10px; color: #484f58; font-style: italic; margin-top: 4px; }
  </style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <h1>Test Server</h1>
    <div class="live"><span class="live-dot"></span> Live</div>

    <h2>Filter</h2>
    <div class="filter-btns" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="webhook">Webhook</button>
      <button class="filter-btn" data-filter="slack">Slack</button>
      <button class="filter-btn" data-filter="stripe">Stripe</button>
      <button class="filter-btn" data-filter="salesforce">Salesforce</button>
      <button class="filter-btn" data-filter="linear">Linear</button>
      <button class="filter-btn" data-filter="hubspot">HubSpot</button>
    </div>

    <h2>Mock Responses</h2>
    <div id="mock-configs"></div>

    <h2>Connection Parameters</h2>
    <div id="connection-params"></div>
  </div>

  <!-- Main: log stream -->
  <div class="main">
    <div class="toolbar">
      <div>
        <h3>Request Log</h3>
        <span class="count" id="log-count">0 requests</span>
      </div>
      <button class="clear-btn" id="clear-btn">Clear</button>
    </div>
    <div id="log-list">
      <div class="empty-state">
        <div class="icon">📡</div>
        <p>Waiting for incoming requests...<br><br>
        Point your Pulse Lite webhook URL to:<br>
        <code style="color:#79c0ff">http://testserver:3055/webhook</code></p>
      </div>
    </div>
  </div>

  <!-- Widget panel -->
  <div class="widget-panel">
    <div class="widget-header">
      <h3>Chat Widget Preview</h3>
    </div>
    <div class="widget-config">
      <label>Paste shareable chat link or full URL</label>
      <input type="text" id="widget-url" placeholder="http://localhost:3001/chat/a8dfa0e8-..." />
      <button id="widget-load">Load</button>
    </div>
    <div class="widget-frame" id="widget-frame">
      <div class="widget-placeholder">
        Paste a shareable chat URL above<br>(e.g. <code style="color:#79c0ff">http://host:3001/chat/chatbot-id</code>)
      </div>
    </div>
  </div>
</div>

<script>
const BASE = location.origin;
let allLogs = [];
let activeFilter = "all";

// ── WebSocket for live updates ─────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "log") {
      allLogs.unshift(msg.data);
      if (allLogs.length > 500) allLogs.length = 500;
      renderLogs();
    } else if (msg.type === "clear") {
      allLogs = [];
      renderLogs();
    } else if (msg.type === "config") {
      renderConfigs(msg.data);
    }
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}
connectWS();

// ── Load initial data ──────────────────────────────────────────────────────
fetch(`${BASE}/api/logs`).then(r => r.json()).then(d => { allLogs = d; renderLogs(); });
fetch(`${BASE}/api/config`).then(r => r.json()).then(renderConfigs);

// ── Filters ────────────────────────────────────────────────────────────────
document.getElementById("filters").addEventListener("click", (e) => {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeFilter = e.target.dataset.filter;
  renderLogs();
});

// ── Clear ──────────────────────────────────────────────────────────────────
document.getElementById("clear-btn").addEventListener("click", () => {
  fetch(`${BASE}/api/logs/clear`, { method: "POST" });
});

// ── Render logs ────────────────────────────────────────────────────────────
function renderLogs() {
  const filtered = activeFilter === "all" ? allLogs : allLogs.filter(l => l.category === activeFilter);
  document.getElementById("log-count").textContent = `${filtered.length} request${filtered.length !== 1 ? "s" : ""}`;

  if (filtered.length === 0) {
    document.getElementById("log-list").innerHTML = `
      <div class="empty-state">
        <div class="icon">📡</div>
        <p>Waiting for incoming requests...<br><br>
        Point your Pulse Lite webhook URL to:<br>
        <code style="color:#79c0ff">http://testserver:3055/webhook</code></p>
      </div>`;
    return;
  }

  document.getElementById("log-list").innerHTML = filtered.map(log => {
    const statusClass = log.response?.status < 300 ? "s2xx" : log.response?.status < 500 ? "s4xx" : "s5xx";
    const time = new Date(log.timestamp).toLocaleTimeString();
    return `
      <div class="log-entry" data-id="${log.id}">
        <div class="log-header" onclick="toggleLog('${log.id}')">
          <span class="log-badge ${log.category}">${log.category}</span>
          <span class="log-method">${log.method}</span>
          <span class="log-path">${log.path}</span>
          <span class="log-status ${statusClass}">${log.response?.status || "—"}</span>
          <span class="log-time">${time}</span>
        </div>
        <div class="log-body" id="body-${log.id}">
          ${log.headers && Object.keys(log.headers).length ? `<h4>Headers</h4><pre>${JSON.stringify(log.headers, null, 2)}</pre>` : ""}
          ${log.body && Object.keys(log.body).length ? `<h4>Request Body</h4><pre>${JSON.stringify(log.body, null, 2)}</pre>` : ""}
          ${log.response ? `<h4>Response</h4><pre>${JSON.stringify(log.response, null, 2)}</pre>` : ""}
        </div>
      </div>`;
  }).join("");
}

function toggleLog(id) {
  const el = document.getElementById("body-" + id);
  if (el) el.classList.toggle("open");
}

// ── Render mock configs ────────────────────────────────────────────────────
function renderConfigs(configs) {
  const container = document.getElementById("mock-configs");
  container.innerHTML = Object.entries(configs).map(([key, cfg]) => `
    <div class="config-group">
      <label>${key}</label>
      <select onchange="updateConfig('${key}', parseInt(this.value))">
        <option value="200" ${cfg.status === 200 || cfg.status === 201 ? "selected" : ""}>Success (${cfg.status})</option>
        <option value="400" ${cfg.status === 400 ? "selected" : ""}>400 Bad Request</option>
        <option value="401" ${cfg.status === 401 ? "selected" : ""}>401 Unauthorized</option>
        <option value="500" ${cfg.status === 500 ? "selected" : ""}>500 Server Error</option>
        <option value="503" ${cfg.status === 503 ? "selected" : ""}>503 Unavailable</option>
      </select>
    </div>
  `).join("");
}

function updateConfig(service, status) {
  fetch(`${BASE}/api/config/${service}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
}

// ── Widget loader ──────────────────────────────────────────────────────────
const savedUrl = localStorage.getItem("ts_widget_url");
if (savedUrl) document.getElementById("widget-url").value = savedUrl;

document.getElementById("widget-load").addEventListener("click", () => {
  const url = document.getElementById("widget-url").value.trim();
  if (!url) return alert("Please paste a chat URL");
  localStorage.setItem("ts_widget_url", url);

  const frame = document.getElementById("widget-frame");
  frame.innerHTML = "";
  const iframe = document.createElement("iframe");
  iframe.src = url;
  iframe.allow = "clipboard-write";
  frame.appendChild(iframe);
});

// ── Connection parameters ─────────────────────────────────────────────────
const DOCKER_HOST = "testserver:3055";   // from within Docker network
const EXT_HOST = location.host;          // from browser (localhost:3055)

const CONNECTIONS = [
  {
    label: "Webhook (Action)",
    desc: "Use in chatbot Actions → Webhook type",
    fields: [
      { label: "URL", value: `http://${DOCKER_HOST}/webhook` },
      { label: "URL (ext)", value: `http://${EXT_HOST}/webhook` },
      { label: "Method", value: "POST" },
      { label: "Secret", value: "test_webhook_secret_123" },
    ],
    where: "Chatbot → Actions → Add action → Webhook",
  },
  {
    label: "Workspace Webhook",
    desc: "Workspace-level event webhooks (requires HTTPS in prod)",
    fields: [
      { label: "URL", value: `http://${EXT_HOST}/webhook` },
      { label: "Secret", value: "test_workspace_secret_456" },
      { label: "Events", value: "conversation.created, conversation.escalated" },
    ],
    where: "Settings → Webhooks → Add Webhook",
  },
  {
    label: "Slack Webhook",
    desc: "Slack incoming webhook mock",
    fields: [
      { label: "URL", value: `http://${DOCKER_HOST}/slack/webhook` },
      { label: "URL (ext)", value: `http://${EXT_HOST}/slack/webhook` },
      { label: "Method", value: "POST" },
      { label: "Format", value: 'JSON: { "text": "..." }' },
    ],
    where: "Integrations → Slack → Webhook URL, or Action → Slack Message → Custom URL",
  },
  {
    label: "Stripe API",
    desc: "Mock Stripe customer/subscription lookup",
    fields: [
      { label: "Base URL", value: `http://${DOCKER_HOST}` },
      { label: "API Key", value: "sk_test_mock_anything" },
      { label: "Auth", value: "Bearer sk_test_mock_anything" },
      { label: "Endpoints", value: "GET /v1/customers, GET /v1/subscriptions" },
    ],
    where: "Integrations → Stripe → API Key",
  },
  {
    label: "Salesforce",
    desc: "Mock Salesforce OAuth + Case creation",
    fields: [
      { label: "Login URL", value: `http://${DOCKER_HOST}` },
      { label: "Token EP", value: `http://${DOCKER_HOST}/services/oauth2/token` },
      { label: "Client ID", value: "mock_sf_client_id" },
      { label: "Client Sec", value: "mock_sf_client_secret" },
      { label: "Username", value: "mock@salesforce.test" },
      { label: "Password", value: "mock_password" },
      { label: "Method", value: "POST" },
    ],
    where: "Integrations → Salesforce config",
  },
  {
    label: "Linear",
    desc: "Mock Linear GraphQL issue creation",
    fields: [
      { label: "API URL", value: `http://${DOCKER_HOST}/graphql` },
      { label: "API Key", value: "lin_api_mock_anything" },
      { label: "Auth", value: "Authorization: lin_api_mock_anything" },
      { label: "Method", value: "POST (GraphQL)" },
    ],
    where: "Integrations → Linear → API Key",
  },
  {
    label: "HubSpot",
    desc: "Mock HubSpot CRM contact push",
    fields: [
      { label: "API URL", value: `http://${DOCKER_HOST}/crm/v3/objects/contacts` },
      { label: "API Key", value: "pat-mock-hubspot-key" },
      { label: "Auth", value: "Bearer pat-mock-hubspot-key" },
      { label: "Method", value: "POST" },
    ],
    where: "Integrations → HubSpot → API Key",
  },
];

function renderConnections() {
  document.getElementById("connection-params").innerHTML = CONNECTIONS.map(conn => `
    <div class="conn-card">
      <div class="conn-label">${conn.label}</div>
      <div class="conn-desc">${conn.desc}</div>
      ${conn.fields.map(f => `
        <div class="conn-field">
          <label>${f.label}</label>
          <div class="conn-url" title="Click to copy" onclick="copyConn(this, '${f.value.replace(/'/g, "\\'")}')">${f.value}</div>
        </div>
      `).join("")}
      <div class="conn-where">${conn.where}</div>
    </div>
  `).join("");
}

function copyConn(el, text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  el.classList.add("copied");
  el.textContent = "Copied!";
  setTimeout(() => { el.classList.remove("copied"); el.textContent = text; }, 1500);
}

renderConnections();
</script>
</body>
</html>
