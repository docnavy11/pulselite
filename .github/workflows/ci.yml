name: CI

on:
  push:
    branches: [main]
  pull_request:

# What this checks, and what it deliberately does not.
#
# The previous workflow started the application in a container and ran ruff,
# bandit and semgrep inside it. The v2 Dockerfile's last stage is the runtime
# image, which carries no dev tools, so every one of those steps died with
# "ruff: executable file not found". It also ran frontend unit tests, Playwright
# e2e and Schemathesis against a JSON API - all three of which the HTMX rewrite
# deleted. Those jobs are gone rather than skipped: a job that cannot pass is
# noise, and noise is how a red CI stops meaning anything.
#
# The test suite has not caught up with the rewrite (see README). So the gate
# here is that the suite still COLLECTS - which is what actually broke, and
# stayed broken unnoticed - while the full run is reported without blocking.

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install --quiet ruff bandit
      - name: Ruff lint
        run: ruff check app/
        working-directory: backend
      - name: Ruff format check
        run: ruff format --check app/
        working-directory: backend
      - name: Bandit
        run: bandit -r app/ --configfile .bandit -ll -q
        working-directory: backend

  tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_dev_password
          POSTGRES_DB: pulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install --quiet uv
          uv pip install --system --quiet -e . pytest pytest-asyncio
        working-directory: backend
      - name: Enable pgvector
        run: PGPASSWORD=pulse_dev_password psql -h localhost -U pulse -d pulse_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Migrate
        run: alembic upgrade head
        working-directory: backend
        env:
          POSTGRES_DB: pulse_test

      # The gate. conftest imported create_app for months after the rewrite
      # removed it, so the whole suite errored at collection and nothing said
      # so. This step is cheap and would have caught it the same day.
      - name: Suite must still collect
        run: pytest tests/ --collect-only -q
        working-directory: backend

      # Reported, not gated, until the suite is rewritten against v2.
      - name: Run tests
        id: run
        continue-on-error: true
        run: pytest tests/ -q --no-header | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: backend
