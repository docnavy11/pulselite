{% extends "base.html" %}
{% block title %}New Chatbot — PulseLight{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 mb-6">Create Chatbot</h1>

<form method="POST" action="/chatbots" class="bg-white rounded-lg border border-gray-200 p-6 max-w-lg space-y-4">
    <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Chatbot name</label>
        <input type="text" name="name" id="name" required autofocus placeholder="e.g. Support Bot"
            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
    </div>
    <div>
        <label for="url" class="block text-sm font-medium text-gray-700">Website URL <span class="text-gray-400">(optional — will crawl and auto-configure)</span></label>
        <input type="url" name="url" id="url" placeholder="https://example.com"
            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
    </div>
    <div class="flex justify-end gap-3 pt-2">
        <a href="/chatbots" class="px-4 py-2 text-sm text-gray-700 hover:text-gray-900">Cancel</a>
        <button type="submit" class="bg-indigo-600 text-white rounded-md px-4 py-2 text-sm font-medium hover:bg-indigo-700">
            Create
        </button>
    </div>
</form>
{% endblock %}
