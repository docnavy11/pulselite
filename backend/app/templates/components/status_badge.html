{% set status = bot.setup_status or 'ready' if bot is defined else 'ready' %}
<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
    {% if status == 'ready' %}bg-green-100 text-green-800
    {% elif status == 'crawling' %}bg-blue-100 text-blue-800
    {% elif status == 'configuring' %}bg-yellow-100 text-yellow-800
    {% elif status == 'setup_failed' %}bg-red-100 text-red-800
    {% else %}bg-gray-100 text-gray-800{% endif %}">
    {{ status|replace('_', ' ')|capitalize }}
</span>
