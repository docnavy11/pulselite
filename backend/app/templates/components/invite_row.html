<div id="invite-{{ invite.id }}" class="flex items-center justify-between py-3">
    <div>
        <p class="text-sm font-medium text-gray-900">{{ invite.email }}</p>
        <div class="flex items-center gap-2 mt-1">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-gray-100 text-gray-600">
                {{ invite.role|capitalize }}
            </span>
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-amber-100 text-amber-700">Pending</span>
            <span class="text-[11px] text-gray-400">expires {{ invite.expires_at.strftime('%b %d') }}</span>
        </div>
    </div>
    <button hx-delete="/settings/team/invite/{{ invite.id }}"
            hx-target="#invite-{{ invite.id }}"
            hx-swap="outerHTML swap:0.15s"
            class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
            title="Revoke invite">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
    </button>
</div>
