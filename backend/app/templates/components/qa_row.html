<div id="qa-{{ pair.id }}" class="bg-white rounded-lg border border-gray-200 p-4">
    <div class="flex items-start justify-between">
        <div class="flex-1">
            <p class="text-sm font-medium text-gray-900">Q: {{ pair.question }}</p>
            {% if pair.answer %}
            <p class="text-sm text-gray-600 mt-1">A: {{ pair.answer[:200] }}{% if pair.answer|length > 200 %}...{% endif %}</p>
            {% endif %}
        </div>
        <div class="flex items-center gap-2 ml-4">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                {% if pair.status == 'passed' %}bg-green-100 text-green-800
                {% elif pair.status == 'failed' %}bg-red-100 text-red-800
                {% else %}bg-gray-100 text-gray-800{% endif %}">
                {{ pair.status }}
            </span>
            {% if pair.confidence_score %}
            <span class="text-xs text-gray-400">{{ '%.0f' % (pair.confidence_score * 100) }}%</span>
            {% endif %}
            <button hx-delete="/chatbots/{{ pair.chatbot_id }}/qa/{{ pair.id }}" hx-target="#qa-{{ pair.id }}" hx-swap="outerHTML"
                    class="text-xs text-red-500 hover:text-red-700">Delete</button>
        </div>
    </div>
</div>
