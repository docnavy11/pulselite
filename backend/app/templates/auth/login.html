<!DOCTYPE html>
<html lang="en" class="h-full bg-[#faf8f5]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — PulseLight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                colors: {
                    brand: { 50: '#fff3ee', 100: '#ffe4d6', 300: '#ffa882', 400: '#ff8552', 500: '#ff6b35', 600: '#e85a26', 700: '#c44a1e' }
                }
            }}
        }
    </script>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="bg-white shadow-sm border border-gray-200 rounded-xl p-8">
            <!-- Brand -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-brand-500 to-brand-400 bg-clip-text text-transparent select-none">PulseLight</h1>
                <p class="text-gray-500 mt-2 text-sm">Sign in to your account</p>
            </div>

            {% if error %}
            <div class="mb-4 rounded-lg bg-red-50 border border-red-100 p-3 text-sm text-red-600">{{ error }}</div>
            {% endif %}

            <!-- Login form -->
            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" id="email" required autofocus placeholder="you@example.com"
                        class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm placeholder-gray-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none transition-colors">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" id="password" required placeholder="Enter your password"
                        class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm placeholder-gray-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none transition-colors">
                </div>
                <button type="submit" class="w-full bg-brand-600 text-white rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-brand-700 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:ring-offset-2">
                    Sign in
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                <div class="relative flex justify-center text-sm"><span class="bg-white px-2 text-gray-500">or</span></div>
            </div>

            <!-- Google OAuth -->
            {% if google_oauth %}
            <a href="/auth/google" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                <svg class="h-4 w-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </a>
            {% else %}
            <p class="text-center text-xs text-gray-400">Google sign-in not configured</p>
            {% endif %}

            <!-- SSO section -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                <div class="relative flex justify-center text-sm"><span class="bg-white px-2 text-gray-500">or</span></div>
            </div>

            <div>
                <p class="mb-2 text-sm font-medium text-gray-700">Sign in with SSO</p>
                <div class="flex gap-2">
                    <input type="email" id="sso-email" placeholder="you@company.com"
                        class="flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm placeholder-gray-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none">
                    <button onclick="alert('SSO check not implemented in v2 yet')"
                        class="bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors whitespace-nowrap">
                        Continue
                    </button>
                </div>
            </div>

            <!-- Register link -->
            <p class="mt-6 text-center text-sm text-gray-500">
                Don't have an account?
                <a href="/register" class="font-medium text-brand-500 hover:text-brand-600">Sign up</a>
            </p>

            <!-- Dev login shortcut -->
            <div class="mt-4 rounded-lg border border-dashed border-gray-300 bg-gray-50 p-3">
                <p class="text-xs font-medium text-gray-500 mb-2">Dev login</p>
                <button type="button" onclick="document.getElementById('email').value='test@pulse.dev';document.getElementById('password').value='test'"
                    class="w-full text-left text-xs text-gray-600 hover:bg-gray-100 rounded px-2 py-1.5 transition-colors">
                    <span class="font-mono">test@pulse.dev</span> / <span class="font-mono">test</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
