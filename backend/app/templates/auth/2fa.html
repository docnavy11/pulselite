<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <title>Two-Factor Authentication — PulseLight</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">
    <div class="w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-8">Enter 2FA Code</h1>
        <form method="POST" action="/auth/2fa/verify" class="bg-white shadow rounded-lg p-6 space-y-4">
            <input type="hidden" name="session_id" value="{{ session_id }}">
            <div>
                <label for="code" class="block text-sm font-medium text-gray-700">Authentication code</label>
                <input type="text" name="code" id="code" required autofocus autocomplete="one-time-code" maxlength="6" pattern="\d{6}"
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-center tracking-widest">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white rounded-md px-4 py-2 text-sm font-medium hover:bg-indigo-700">Verify</button>
        </form>
    </div>
</body>
</html>
