[project]
name = "pulselite"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<0.116",  # starlette <1.0: code uses TemplateResponse(name, context)
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.2",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "cryptography>=44",
    "pyotp>=2.9",
    "qrcode>=8",
    # LLM clients
    "openai>=1.60",
    "anthropic>=0.43",
    "httpx>=0.28",
    "tiktoken>=0.8",
    # Document processing
    "PyMuPDF>=1.25",
    "python-docx>=1.1",
    "trafilatura>=2.0",
    "defusedxml>=0.7",
    "beautifulsoup4>=4.12",
    # Embedding
    "fastembed>=0.5",
    "numpy>=2.0",
    # Reranking (optional — graceful fallback if missing)
    "sentence-transformers>=3.4",
    # Clustering (for gap analysis)
    "bertopic>=0.16",
    "hdbscan>=0.8",
    "umap-learn>=0.5",
    "scikit-learn>=1.6",
    # Integrations
    "slack_sdk>=3.34",
    "stripe>=11",
    "resend>=2",
    # Scheduling
    "apscheduler>=3.10,<4",
    # Browser fallback
    "playwright>=1.49",
    # Internal LLM calls via the Claude Code CLI credentials — no API key
    "claude-agent-sdk>=0.2.152",
    # Settings
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    # Long lines here are inline HTML fragments returned by HTMX endpoints.
    # Splitting a class attribute across lines to satisfy a linter makes the
    # markup harder to read, not easier.
    "E501",
    # SQLAlchemy filters are built with `Column == True`: `is True` cannot be
    # overloaded, so the "fix" would stop generating SQL and start evaluating
    # Python. Use `.is_(True)` if you want it gone for real.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# main.py imports its routers after the app object exists, deliberately - that
# is the shape of the application, not an accident of ordering.
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Twelve test modules import helpers as `from tests.factories import ...`, and
# only `app*` is installed as a package - so `tests` is importable only if the
# project root is on sys.path. It was, on the machine that wrote them, via a
# leftover editable-install path file; on a clean checkout it is not, and the
# suite failed to collect. Stated here instead of depending on that accident.
pythonpath = ["."]

[tool.coverage.run]
omit = ["alembic/*", "scripts/*", "tests/*"]
