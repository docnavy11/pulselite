[project]
name = "pulselight"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.2",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "cryptography>=44",
    "pyotp>=2.9",
    "qrcode>=8",
    # LLM clients
    "openai>=1.60",
    "anthropic>=0.43",
    "httpx>=0.28",
    "tiktoken>=0.8",
    # Document processing
    "PyMuPDF>=1.25",
    "python-docx>=1.1",
    "trafilatura>=2.0",
    "defusedxml>=0.7",
    "beautifulsoup4>=4.12",
    # Embedding
    "fastembed>=0.5",
    "numpy>=2.0",
    # Reranking (optional — graceful fallback if missing)
    "sentence-transformers>=3.4",
    # Clustering (for gap analysis)
    "bertopic>=0.16",
    "hdbscan>=0.8",
    "umap-learn>=0.5",
    "scikit-learn>=1.6",
    # Integrations
    "slack_sdk>=3.34",
    "stripe>=11",
    "resend>=2",
    # Scheduling
    "apscheduler>=3.10,<4",
    # Browser fallback
    "playwright>=1.49",
    # Settings
    "pydantic-settings>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["alembic/*", "scripts/*", "tests/*"]
