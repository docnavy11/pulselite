services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pulselite:
    build:
      context: .
      dockerfile: Dockerfile.light
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides for single-container mode
      - POSTGRES_HOST=postgres
      - REDIS_HOST=127.0.0.1
      - SERVE_FRONTEND=true
      - INTERNAL_API_URL=http://127.0.0.1:8000
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
